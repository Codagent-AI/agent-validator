name: agent-validator
base_branch: main
log_dir: validator_logs
debug_log:
  enabled: true
  max_size_mb: 10
allow_parallel: true

entry_points:
  - path: "."
    exclude:
      - .validator
      - evals/results
      - openspec
      - skills
      - .claude/skills
    checks:
      - build:
          command: bun run build:local
      - lint:
          command: bunx biome check src
      - typecheck:
          command: bun run typecheck
      - test:
          command: bun test
      - security-code:
          command: semgrep scan --config auto --error src
      - security-deps:
          # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3) has no patched npm release yet and is reached only
          # through the dev dependency @changesets/cli. Remove the ignore once braces ships a fix.
          # GHSA-hp3w-g68c-fv3c (sprintf-js <=1.1.3) has no patched release yet and is reached only
          # through argparse, which js-yaml 3 uses for its CLI binary and never loads from the library
          # that gray-matter imports. Remove the ignore once sprintf-js ships a fix.
          command: bun audit --audit-level=moderate --ignore=GHSA-vfj7-8cjw-p6xm --ignore=GHSA-hp3w-g68c-fv3c
      - schema-validate:
          command: bun run src/index.ts validate
    reviews:
      - all-reviewers:
          builtin: all-reviewers
      - task-compliance:
          builtin: task-compliance
          enabled: false # Opt-in: activate with `agent-validator run --enable-review task-compliance --context-file <task>`
  - path: "skills"
    reviews:
      - skill-quality
  - path: ".claude/skills"
    reviews:
      - skill-quality
