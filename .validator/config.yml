name: agent-validator
base_branch: main
log_dir: validator_logs
debug_log:
  enabled: true
  max_size_mb: 10
allow_parallel: true

entry_points:
  - path: "."
    exclude:
      - .validator
      - evals/results
      - openspec
      - skills
      - .claude/skills
    checks:
      - build:
          command: bun run build:local
      - lint:
          command: bunx biome check src
      - typecheck:
          command: bun run typecheck
      - test:
          command: bun test
      - security-code:
          command: semgrep scan --config auto --error src
      - security-deps:
          command: bun audit --audit-level=moderate
      - schema-validate:
          command: bun run src/index.ts validate
    reviews:
      - all-reviewers:
          builtin: all-reviewers
      - task-compliance:
          builtin: task-compliance
          enabled: false # Opt-in: activate with `agent-validator run --enable-review task-compliance --context-file <task>`
  - path: "skills"
    reviews:
      - skill-quality
  - path: ".claude/skills"
    reviews:
      - skill-quality
