runtimes:
  bun:
    version: "1.3.11"
  node:
    version: "22"

setup:
  - name: Install Dependencies
    run: bun install

checks:
  - name: lint
    requires_runtimes: [bun]

  - name: test
    requires_runtimes: [bun, node]
    setup:
      - name: Build CLI for integration tests
        run: bun run build:npm

  - name: security-deps
    requires_runtimes: [bun]

  - name: security-code
    requires_runtimes: [bun]
    setup:
      - name: Install Semgrep
        run: python3 -m pip install semgrep

  - name: typecheck
    requires_runtimes: [bun]
