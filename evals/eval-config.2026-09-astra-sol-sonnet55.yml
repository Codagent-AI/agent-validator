# 2026-09 round: Codex GPT-6 Astra / GPT-6 Sol and Claude Sonnet 5.5 at low effort,
# plus Codex GPT-5.5 medium as a control against the 2026-05-02 baseline.
fixture: fixtures/all-reviewers
builtin_prompt: all-reviewers

adapters:
  - name: codex
    model: gpt-6-astra
    alias: codex-gpt6-astra
    allow_tool_use: false
    thinking_budget: low
  - name: codex
    model: gpt-6-sol
    alias: codex-gpt6-sol
    allow_tool_use: false
    thinking_budget: low
  - name: claude
    model: claude-sonnet-5-5
    alias: claude-sonnet5.5
    allow_tool_use: false
    thinking_budget: low
  - name: codex
    model: gpt-5.5
    alias: codex-gpt5.5-ctrl
    allow_tool_use: false
    thinking_budget: medium

runs_per_config: 1
timeout_ms: 600000
judge:
  adapter: claude
  model: claude-opus-5-5
  thinking_budget: high
