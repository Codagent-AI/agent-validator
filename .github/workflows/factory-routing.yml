name: Factory routing

on:
  issues:
    types: [opened, reopened, edited, closed, labeled, unlabeled, typed]
  pull_request:
    types: [opened, reopened, edited, closed, labeled, unlabeled]

permissions:
  contents: read

jobs:
  route:
    uses: Codagent-AI/agent-factory/.github/workflows/route-work.yml@f38c6b4a4c7f84a53417696fcdf17c28839e4336
    with:
      factory-revision: f38c6b4a4c7f84a53417696fcdf17c28839e4336
    secrets:
      factory-app-private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
