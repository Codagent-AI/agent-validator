name: Factory routing

on:
  issues:
    types: [opened, reopened, edited, closed, labeled, unlabeled, typed]
  pull_request:
    types: [opened, reopened, edited, closed, labeled, unlabeled]

permissions:
  contents: read

jobs:
  route:
    uses: Codagent-AI/agent-factory/.github/workflows/route-work.yml@be1081398867f0c72c27f577fba3784013d16e1a
    with:
      factory-revision: be1081398867f0c72c27f577fba3784013d16e1a
    secrets:
      factory-app-private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
