name: Factory routing

on:
  issues:
    types: [opened, reopened, edited, closed, labeled, unlabeled, typed]
  pull_request:
    types: [opened, reopened, edited, closed, labeled, unlabeled]

permissions:
  contents: read

jobs:
  route:
    uses: Codagent-AI/agent-factory/.github/workflows/route-work.yml@4f332c02f01065057a0f66a2891d18b275fe6f7f
    with:
      factory-revision: 4f332c02f01065057a0f66a2891d18b275fe6f7f
    secrets:
      factory-app-private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
