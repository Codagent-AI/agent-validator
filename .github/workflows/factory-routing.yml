name: Factory routing

on:
  issues:
    types: [opened, reopened, edited, closed, labeled, unlabeled, typed]
  pull_request:
    types: [opened, reopened, edited, closed, labeled, unlabeled]

permissions:
  contents: read

jobs:
  route:
    uses: Codagent-AI/agent-factory/.github/workflows/route-work.yml@2445e6db54131dded49c5bfac0d81962ec683c64
    with:
      factory-revision: 2445e6db54131dded49c5bfac0d81962ec683c64
    secrets:
      factory-app-private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
